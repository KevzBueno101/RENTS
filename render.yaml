services:
  - type: web
    name: rents-system
    runtime: python
    pythonVersion: "3.12"
    branch: dev
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn rents_system.wsgi
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: rents_system.settings
      - key: PYTHON_VERSION
        value: "3.12"